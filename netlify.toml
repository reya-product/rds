[build]
  # Builds are handled by GitHub Actions (.github/workflows/deploy-prototypes.yml).
  # This tells Netlify to skip its own build step.
  ignore = "exit 1"

# Rewrite all requests to index.html so Flutter's client-side router handles them.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
