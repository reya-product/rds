name: Deploy Widgetbook to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'widgetbook/**'
      - 'packages/rds/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Get dependencies (rds package)
        working-directory: packages/rds
        run: flutter pub get

      - name: Get dependencies (widgetbook)
        working-directory: widgetbook
        run: flutter pub get

      - name: Build web
        working-directory: widgetbook
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Add 404.html for SPA routing
        # Routes 404s to the correct sub-app (widgetbook root or /prototypes/).
        # The target app's index.html reads __spa from sessionStorage and restores
        # the original path via history.replaceState before Flutter initialises.
        run: |
          REPO="${{ github.event.repository.name }}"
          cat > widgetbook/build/web/404.html << EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <title>Redirecting...</title>
            <script>
              (function () {
                var l = window.location;
                var base = '/${REPO}';
                var path = l.pathname;
                if (path.startsWith(base + '/prototypes/')) {
                  sessionStorage['__spa'] = path + l.search;
                  l.replace(base + '/prototypes/');
                } else {
                  sessionStorage['__spa'] = path + l.search;
                  l.replace(base + '/');
                }
              })();
            </script>
          </head>
          <body></body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: widgetbook/build/web
          keep_files: true
