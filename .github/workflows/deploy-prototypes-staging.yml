name: Deploy Prototypes (Staging) to GitHub Pages

on:
  push:
    branches: [staging]
    paths:
      - 'prototypes/**'
      - 'packages/rds/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: stable
          cache: true

      - name: Enable Flutter web
        run: flutter config --enable-web

      - name: Get dependencies (rds package)
        working-directory: packages/rds
        run: flutter pub get

      - name: Get dependencies (prototypes)
        working-directory: prototypes
        run: flutter pub get

      - name: Build web
        working-directory: prototypes
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/prototypes-staging/ --dart-define=STAGING=true --no-tree-shake-icons

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: prototypes/build/web
          destination_dir: prototypes-staging
          keep_files: true
