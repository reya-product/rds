name: widgetbook_app
description: RDS — Reya Design System · Widgetbook renderer
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  rds:
    path: ../packages/rds
  widgetbook: ^3.7.0
